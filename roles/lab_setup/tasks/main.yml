---
- name: Load netris-lab variables
  ansible.builtin.include_vars:
    file: "{{ netris_lab_dir }}/group_vars/all.yml"

- name: Pre-flight checks
  ansible.builtin.include_tasks: "{{ role_path }}/../lab_deploy/tasks/preflight.yml"

- name: Remove stale collections left by rsync
  ansible.builtin.file:
    path: "{{ netris_lab_dir }}/collections/ansible_collections"
    state: absent

- name: Install Ansible collections
  ansible.builtin.command:
    cmd: ansible-galaxy collection install -r requirements.yml -p collections --force
    chdir: "{{ netris_lab_dir }}"
  changed_when: false

- name: Pre-install EPEL from URL (RHEL has no epel-release in base repos)
  ansible.builtin.shell:
    cmd: |
      if rpm -q epel-release &>/dev/null; then
        echo "already_installed"
      else
        dnf install -y "https://dl.fedoraproject.org/pub/epel/epel-release-latest-$(rpm -E %rhel).noarch.rpm"
        echo "installed"
      fi
  register: _epel_install
  changed_when: "'installed' == _epel_install.stdout | trim"
  when: ansible_os_family == "RedHat"

- name: Run prerequisites
  ansible.builtin.include_role:
    name: prerequisites

- name: Install Python kubernetes client
  ansible.builtin.pip:
    name: kubernetes
    state: present

- name: Downgrade crun to avoid eBPF device filter bug (RHEL 9 systemd)
  ansible.builtin.shell:
    cmd: |
      CURRENT=$(rpm -q --qf '%{VERSION}' crun 2>/dev/null)
      if [[ "$CURRENT" =~ ^1\.(2[6-9]|[3-9]) ]]; then
        dnf downgrade -y 'crun-1.23.1-2.el9*'
        dnf install -y python3-dnf-plugin-versionlock 2>/dev/null || true
        dnf versionlock add crun 2>/dev/null || true
        echo "downgraded_and_locked"
      else
        echo "skipped"
      fi
  register: _crun_fix
  changed_when: "'downgraded' in _crun_fix.stdout"

- name: Cache container and cloud images
  ansible.builtin.include_role:
    name: cache

- name: Install OCP and OSAC dependencies
  ansible.builtin.dnf:
    name:
      - podman
      - dnsmasq
      - zstd
      - pigz
    state: present

- name: Install aicli and awscli
  ansible.builtin.pip:
    name:
      - aicli
      - awscli
    state: present

- name: Install oc CLI
  ansible.builtin.shell:
    cmd: |
      curl -fsSL https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable/openshift-client-linux.tar.gz \
        | tar xzf - -C /usr/local/bin oc kubectl
    creates: /usr/local/bin/oc

- name: Install helm
  ansible.builtin.command:
    cmd: bash -c "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
    creates: /usr/local/bin/helm

- name: Install Go toolchain
  ansible.builtin.shell:
    cmd: |
      curl -fsSL https://go.dev/dl/go1.24.4.linux-amd64.tar.gz \
        | tar xzf - -C /usr/local
    creates: /usr/local/go/bin/go

- name: Check if fulfillment-service already exists
  ansible.builtin.stat:
    path: /opt/fulfillment-service
  register: _fs_exists

- name: Clone fulfillment-service
  ansible.builtin.git:
    repo: "{{ fulfillment_service_repo }}"
    dest: /opt/fulfillment-service
    version: "{{ fulfillment_service_branch | default('main', true) }}"
    force: true
  when: not _fs_exists.stat.exists

- name: Build osac CLI
  ansible.builtin.command:
    cmd: /usr/local/go/bin/go build -o /usr/local/bin/osac ./cmd/osac
    chdir: /opt/fulfillment-service
    creates: /usr/local/bin/osac
  environment:
    GOPATH: /root/go
    GOCACHE: /root/.cache/go-build

- name: Cache snapshot flavor image
  ansible.builtin.include_role:
    name: snapshot_pull
